<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>YAN1</title>

    <script>
        function isYAN1App() {
            return (window.AndroidPython && typeof window.AndroidPython.executePython === "function");
        }

        function openInYAN1App() {
            if (isYAN1App()) return;
            if (sessionStorage.getItem("yan1_launched") === "true") return;
            sessionStorage.setItem("yan1_launched", "true");

            const currentURL = window.location.href;
            const cleanPath = currentURL.replace(/^https?:\/\//, "");
            const intentURL =
                "intent://" + cleanPath + "#Intent;" +
                "scheme=https;" +
                "package=com.example1.yan1appgen1;" +
                "S.browser_fallback_url=" + encodeURIComponent(currentURL) + ";" +
                "end;";

            window.location.href = intentURL;
        }

        setTimeout(openInYAN1App, 1200);
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #000;
            color: #fff;

            font-family: Arial, sans-serif;
        }

        #loading {
            font-size: 20px;
            letter-spacing: 3px;
        }
    </style>
</head>


<body>

    <div id="loading">
        LOADING...
    </div>


    <script>

        // ============================================
        // PUT YOUR FOLDER NAMES HERE
        // ============================================

        const folders = [

            "GOOGLE",
            "BBC",
            "LEMMY",
            "REDDIT",
            "THE GUARDIAN",
            "AI JAZEERA"

        ];


        // ============================================
        // RANDOMLY SELECT ONE FOLDER
        // ============================================

        const randomIndex =
            Math.floor(Math.random() * folders.length);

        const selectedFolder =
            folders[randomIndex];


        // ============================================
        // OPEN THE INDEX.HTML INSIDE THAT FOLDER
        // ============================================

        window.location.replace(
            "./" + selectedFolder + "/index.html"
        );

    </script>

</body>

</html>
